<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Hermandad Jesús del Aposento</title>
</head>
<body>
    <header class="header">
        <img src="./assets/escudo.png" alt="Escudo" class="imgEscudo">    
        <div class="menu" id="menuBtn">☰</div>
        <!-- 🔽 Menú desplegable -->
        <nav class="navMenu" id="navMenu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Historia</a></li>
                <li><a href="#">Imágenes</a></li>
                <li><a href="#">Devotos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="divs1">
            <div class="slider" id="slider">
                <div class="slide"><img src="./assets/señorSepultado.jpeg" alt="Imagen 1" class="img"></div>
                <div class="slide"><img src="./assets/Aposento.jpeg" alt="Imagen 2" class="img"></div>
                <div class="slide"><img src="./assets/SeñorSepultado1.jpeg" alt="Imagen 3" class="img"></div>
                <div class="slide"><img src="./assets/aposento2.jpeg" alt="Imagen 4" class="img"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Hermandad Jesús del Aposento © 2025</p>
    </footer>

    <script>
        // ===== SLIDER =====
        let index = 0;
        const slider = document.getElementById("slider");
        const totalSlides = document.querySelectorAll(".slide").length;
    
        function moveSlide() {
            index = (index + 1) % totalSlides;
            slider.style.transform = `translateX(-${index * 100}%)`;
        }
        setInterval(moveSlide, 10000);
    
        // ===== MENU DESPLEGABLE MEJORADO =====
        const menuBtn = document.getElementById("menuBtn");
        const navMenu = document.getElementById("navMenu");
    
        // Toggle del menú al hacer click en el ícono
        menuBtn.addEventListener("click", (e) => {
            e.stopPropagation(); // Evita que se cierre inmediatamente
            navMenu.classList.toggle("active");
        });
    
        // Cerrar el menú al hacer click fuera de él
        document.addEventListener("click", (e) => {
            if (!navMenu.contains(e.target) && navMenu.classList.contains("active")) {
                navMenu.classList.remove("active");
            }
        });
    </script>
    
</body>
</html>
